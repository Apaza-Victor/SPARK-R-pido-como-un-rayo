<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPARK — Rápido como un rayo</title>
<meta name="description" content="Conoce tus atajos de teclado. Elige una herramienta, pasa el ratón por un atajo y mira cómo se iluminan las teclas.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<canvas id="bg-3d" aria-hidden="true"></canvas>

<aside class="sidebar" data-view="tools" aria-label="Explorador de herramientas">
  <div class="track">

    <!-- página 1: herramientas -->
    <section class="page">
      <div class="page-head">
        <div class="brand">
          <div class="brand-id">
            <a class="logo" href="./" aria-label="SPARK">
              <svg width="90" height="90" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#57b4ff"/>
                    <stop offset="1" stop-color="#0a6cff"/>
                  </linearGradient>
                </defs>
                <rect x="6" y="8" width="78" height="76" rx="18" fill="#0a2238"/>
                <rect x="6" y="4" width="78" height="72" rx="18" fill="url(#brandGrad)"/>
                <rect x="6" y="4" width="78" height="72" rx="18" fill="none" stroke="#ffffff26" stroke-width="2"/>
                <text x="45" y="57" text-anchor="middle" font-family="Nunito, system-ui, sans-serif" font-size="50" font-weight="900" fill="#ffffff" letter-spacing="-1">S</text>
                <path fill="#9ff1ff" d="M68 12 C66 19 61 24 54 26 C61 28 66 33 68 40 C70 33 75 28 82 26 C75 24 70 19 68 12 Z"/>
                <circle cx="73" cy="54" r="3" fill="#9ff1ff"/>
              </svg>
            </a>
            <div class="brand-name">
              <span class="brand-word">SPARK</span>
              <span class="brand-tag">Rápido como un rayo</span>
            </div>
          </div>
          <div class="brand-side">
            <a class="version" href="#changelog">v0.0.1</a>
            <div class="controls">
              <button class="ctrl-btn" id="kb-btn" type="button" aria-label="Teclado" title=""></button>
              <button class="ctrl-btn" id="lang-btn" type="button" aria-label="Idioma" title=""></button>
            </div>
          </div>
        </div>
        <div class="search">
          <svg class="search-ico" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"></circle>
            <line x1="10.8" y1="10.8" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line>
          </svg>
          <input type="search" id="tool-search" placeholder="Buscar" autocomplete="off" aria-label="Buscar herramientas">
        </div>
        <nav class="brand-strip" id="brand-strip" aria-label="Programas"></nav>
      </div>
      <nav class="cats page-body" id="cats" aria-label="Herramientas"></nav>
      <footer class="sidebar-credit">
        Hecho con <span style="opacity:.8">⌘</span> · <a href="#changelog">Cambios</a> <span class="sep">·</span> <a href="#" target="_blank" rel="noopener">Contacto</a>
      </footer>
    </section>

    <!-- página 2: atajos -->
    <section class="page" id="sc-page" aria-label="Atajos de la herramienta">
      <div class="sc-head page-head">
        <button class="back" type="button">
          <svg class="back-arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span class="back-text">Volver a todas las herramientas</span>
        </button>
        <h1 class="sc-title" id="sc-title"></h1>
        <div class="search">
          <svg class="search-ico" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"></circle>
            <line x1="10.8" y1="10.8" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line>
          </svg>
          <input type="search" id="sc-search" placeholder="Buscar atajos" autocomplete="off" aria-label="Buscar atajos">
        </div>
      </div>
      <div class="page-body sc-body" id="sc-body"></div>
    </section>

  </div>
</aside>

<main id="stage">
  <div class="stage-inner" id="stage-inner">
    <div class="kb-shell" id="kb">
      <div class="kb-display" id="kb-display">
        <div class="kb-display-label" id="kb-display-label">Pasa el ratón por un atajo</div>
        <div class="kb-display-keys" id="kb-display-keys"></div>
      </div>
      <div class="kb-results" id="kb-results" hidden></div>
      <div class="kb-board" id="kb-board"></div>
      <div class="kb-hint" id="kb-hint">Elige una herramienta para empezar</div>
    </div>
  </div>
</main>

<footer class="credit">
  SPARK · <a href="#changelog">Cambios</a>
</footer>

<div id="confetti-layer" aria-hidden="true"></div>

<script src="js/keys.js"></script>
<script src="js/logos.js"></script>
<script src="js/bg.js"></script>
<script src="js/twboard.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
